<title>هيثم للديكورات</title>
<meta name="description" content="هيثم للديكورات - تواصل معنا عبر واتساب أو الاتصال المباشر">
<meta name="theme-color" content="#bfeadf">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --sky-top: #bfeadf;
    --sky-mid: #e4f6df;
    --sky-low: #fff6cf;
    --leaf: #3e9b6a;
    --leaf-deep: #1f5e4a;
    --ink: #17382f;
    --glass: rgba(255, 255, 255, 0.72);
    --glass-edge: rgba(255, 255, 255, 0.95);
    --wa: #25d366;
    --fb: #1877f2;
    --tt: #111418;
    --ig: #d6249f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    background-attachment: fixed;
    min-height: 100svh;
    overflow-x: hidden;
  }

  /* ---------- Nature background ---------- */
  .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sun {
    position: absolute; top: -90px; left: 50%; width: 360px; height: 360px; margin-left: -180px;
    background: radial-gradient(circle, rgba(255, 244, 190, 0.95) 0%, rgba(255, 238, 160, 0.55) 35%, rgba(255, 238, 160, 0) 70%);
    animation: sun 9s ease-in-out infinite;
  }
  @keyframes sun { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
  .hills { position: absolute; left: -5%; bottom: 0; width: 110%; height: 42vh; min-height: 220px; }
  .hills .h1 { animation: sway 14s ease-in-out infinite alternate; }
  .hills .h2 { animation: sway 18s ease-in-out infinite alternate-reverse; }
  .hills .h3 { animation: sway 22s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  .drop {
    position: absolute; bottom: -20px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.35) 55%, rgba(190,235,225,.2));
    box-shadow: inset -1px -2px 3px rgba(62,155,106,.18), 0 0 8px rgba(255,255,255,.6);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(.8); opacity: 0; }
    12%  { opacity: .95; }
    50%  { transform: translate(var(--dx), -55vh) scale(1); }
    100% { transform: translate(calc(var(--dx) * -1), -115vh) scale(1.05); opacity: 0; }
  }

  /* ---------- Page ---------- */
  main {
    position: relative; z-index: 1;
    width: min(100%, 440px); margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 150px) 20px calc(env(safe-area-inset-bottom, 0px) + 48px);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  @keyframes coverIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .photo-wrap {
    position: relative; width: 224px; height: 224px; margin-bottom: 18px;
    animation: arrive .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  .photo-wrap::before {
    content: ""; position: absolute; inset: -9px; border-radius: 50%;
    background: conic-gradient(from 0deg, #ffe58a, #8fdca8, #3e9b6a, #bfeadf, #ffe58a);
    animation: spin 16s linear infinite;
  }
  .photo-wrap::after {
    content: ""; position: absolute; inset: -9px; border-radius: 50%;
    box-shadow: 0 0 40px 6px rgba(255, 236, 150, .55);
    animation: glow 4s ease-in-out infinite;
  }
  .photo {
    position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover; object-position: center top;
    border: 6px solid #fff; background: #e7f5ee;
    box-shadow: 0 14px 34px rgba(31, 94, 74, .28);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }

  .nfc-card {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 1.586 / 1;
    border-radius: 22px; padding: 20px 22px; overflow: hidden; color: #fff;
    background:
      radial-gradient(circle at 85% 12%, rgba(255, 233, 150, .55), rgba(255, 233, 150, 0) 45%),
      linear-gradient(135deg, #2f8660 0%, #1f5e4a 55%, #143f33 100%);
    box-shadow: 0 18px 38px rgba(20, 63, 51, .38), inset 0 0 0 1.5px rgba(255, 255, 255, .22);
    transform: rotate(-2deg);
    display: flex; flex-direction: column; justify-content: space-between;
    animation: arrive .9s .1s cubic-bezier(.2, .8, .2, 1) both;
  }
  .nfc-card::before {
    content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
    transform: skewX(-18deg);
    animation: shine 5s 1.2s ease-in-out infinite;
  }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .nfc-card .top { display: flex; justify-content: space-between; align-items: flex-start; direction: ltr; }
  .nfc-card .chip {
    width: 44px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #ffe58a, #e0b84a 60%, #f6d26b);
    box-shadow: inset 0 0 0 1px rgba(120, 85, 10, .35);
    background-image:
      linear-gradient(90deg, transparent 31%, rgba(120, 85, 10, .35) 31% 33%, transparent 33% 66%, rgba(120, 85, 10, .35) 66% 68%, transparent 68%),
      linear-gradient(0deg, transparent 47%, rgba(120, 85, 10, .35) 47% 53%, transparent 53%),
      linear-gradient(135deg, #ffe58a, #e0b84a 60%, #f6d26b);
  }
  .nfc-card .waves { width: 40px; height: 40px; color: #fff; opacity: .95; }
  .nfc-card .brand { font-weight: 800; font-size: 1.55rem; line-height: 1.2; }
  .nfc-card .sub { font-weight: 500; font-size: .95rem; opacity: .85; direction: ltr; text-align: right; }
  .nfc-card .bottom { display: flex; flex-direction: column; gap: 2px; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; animation: arrive .9s .15s cubic-bezier(.2, .8, .2, 1) both; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 64px; padding: 10px 14px; border-radius: 22px;
    text-decoration: none; color: var(--ink);
    font-weight: 700; font-size: 1.12rem;
    background: var(--glass); border: 1.5px solid var(--glass-edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 22px rgba(31, 94, 74, .13);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(31, 94, 74, .2); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--leaf-deep); outline-offset: 3px; }
  .ico {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
  }
  .ico svg { width: 24px; height: 24px; }
  .btn.primary {
    min-height: 74px; font-size: 1.3rem; color: #fff;
    background: linear-gradient(135deg, #2fd16f, #139a50); border-color: rgba(255,255,255,.55);
    box-shadow: 0 12px 28px rgba(19, 154, 80, .38);
  }
  .btn.primary .ico { background: rgba(255,255,255,.22); width: 50px; height: 50px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row .btn { flex-direction: column; justify-content: center; gap: 6px; text-align: center; min-height: 92px; font-size: 1.02rem; padding: 12px 8px; }
  .row.three { grid-template-columns: repeat(3, 1fr); }
  .row.three .btn { font-size: .98rem; }

  .bg-wa { background: var(--wa); }
  .bg-fb { background: var(--fb); }
  .bg-tt { background: var(--tt); }
  .bg-ig { background: linear-gradient(45deg, #fdb94e, #f0443e 45%, #c32aa3 75%, #6a3fd0); }
  .bg-call { background: var(--leaf); }
  .bg-save { background: var(--leaf-deep); }

  /* ---------- Leave your number ---------- */
  .leave {
    width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border-radius: 22px; background: var(--glass); border: 1.5px solid var(--glass-edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 22px rgba(31, 94, 74, .13);
    animation: arrive .9s .25s cubic-bezier(.2, .8, .2, 1) both;
  }
  .leave label { font-weight: 700; font-size: 1.05rem; }
  .leave .field { display: flex; gap: 10px; }
  .leave input {
    flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 16px;
    border: 1.5px solid #bcd9cb; background: #fff; color: var(--ink);
    font: inherit; font-size: 1.1rem; direction: ltr; text-align: left;
  }
  .leave input::placeholder { color: #8aa79b; }
  .leave input:focus-visible { outline: 3px solid var(--leaf-deep); outline-offset: 2px; }
  .leave button {
    flex: none; height: 52px; padding: 0 18px; border: 0; border-radius: 16px; cursor: pointer;
    background: var(--leaf-deep); color: #fff; font: inherit; font-weight: 700; font-size: 1rem;
    transition: transform .18s ease;
  }
  .leave button:active { transform: scale(.96); }
  .leave button:focus-visible { outline: 3px solid var(--leaf-deep); outline-offset: 3px; }
  .leave .msg { min-height: 1.3em; font-size: .92rem; color: #b3261e; font-weight: 700; }

  /* ---------- Products ---------- */
  .products { width: 100%; display: flex; flex-direction: column; gap: 12px; animation: arrive .9s .3s cubic-bezier(.2, .8, .2, 1) both; }
  .product {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    border-radius: 22px; background: var(--glass); border: 1.5px solid var(--glass-edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 22px rgba(31, 94, 74, .13);
  }
  .product img {
    flex: none; width: 76px; height: 76px; border-radius: 16px; object-fit: cover; background: #e7f5ee;
  }
  .product .pimg { flex: none; width: 76px; height: 76px; border-radius: 16px; background: #e7f5ee; display: grid; place-items: center; }
  .product .pimg svg { width: 62px; height: 62px; }
  .product .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .product .name { font-weight: 700; font-size: 1.08rem; line-height: 1.3; }
  .product .price { font-weight: 800; font-size: 1.3rem; color: var(--leaf-deep); }
  .product .order {
    flex: none; align-self: center; padding: 10px 14px; border-radius: 14px;
    background: var(--wa); color: #fff; font-weight: 700; font-size: .95rem; text-decoration: none;
    transition: transform .18s ease;
  }
  .product .order:active { transform: scale(.95); }
  .product .order:focus-visible { outline: 3px solid var(--leaf-deep); outline-offset: 3px; }

  @media (max-width: 360px) {
    .photo-wrap { width: 196px; height: 196px; }
    .row.three .btn { font-size: .88rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .drop { display: none; }
  }
</style>

<script>
  // إرسال رقم الزائر إلى واتساب صاحب البطاقة
  (function () {
    var input = document.getElementById('visitorPhone');
    var btn = document.getElementById('sendPhone');
    var msg = document.getElementById('phoneMsg');
    function send() {
      var raw = input.value.trim();
      var digits = raw.replace(/\D/g, '');
      if (digits.length < 9) { msg.textContent = 'اكتب رقم هاتف صحيحاً.'; input.focus(); return; }
      msg.textContent = '';
      var text = 'مرحباً، أرجو الاتصال بي على الرقم: ' + raw;
      window.open('https://wa.me/212668232431?text=' + encodeURIComponent(text), '_blank');
    }
    btn.addEventListener('click', send);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  })();

  // حبات ندى متحركة في الخلفية
  (function () {
    var scene = document.querySelector('.scene');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 22; i++) {
      var d = document.createElement('span');
      var size = 6 + Math.random() * 16;
      d.className = 'drop';
      d.style.width = d.style.height = size + 'px';
      d.style.left = (Math.random() * 100) + '%';
      d.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
      d.style.animationDuration = (11 + Math.random() * 14) + 's';
      d.style.animationDelay = (-Math.random() * 24) + 's';
      scene.appendChild(d);
    }
  })();
</script>
